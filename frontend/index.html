<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F8F9F6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111922" media="(prefers-color-scheme: dark)" />
    <title>至知</title>
    <meta
      name="description"
      content="至知：记录技术实践、项目复盘和长期学习的个人博客。"
    />
    <meta property="og:site_name" content="至知" />
    <meta property="og:locale" content="zh_CN" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="alternate" type="application/atom+xml" title="至知" href="/feed.xml" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%23F8F9F6'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' font-family='Songti SC, SimSun, serif' font-weight='700' fill='%231B2733'%3E%E8%87%B3%3C/text%3E%3C/svg%3E"
    />
    <script>
      // 主题预置（DESIGN.md §4.5）：在 CSS 加载前先落下 data-theme，避免首屏闪烁。
      // 三态：无 data-theme = 跟随系统；light / dark = 显式指定。持久化键 zhizhi:theme。
      (function () {
        try {
          var saved = localStorage.getItem("zhizhi:theme");
          if (saved === "light" || saved === "dark") {
            document.documentElement.dataset.theme = saved;
          }
        } catch (e) {
          /* localStorage 不可用时跟随系统即可 */
        }
      })();
    </script>
    <style>
      /* JS bundle 加载前的底色兜底：与 --paper 同值，避免深色读者看到白闪 */
      html { background: #F8F9F6; }
      html[data-theme="dark"] { background: #111922; }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]) { background: #111922; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f7f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#2f342d" media="(prefers-color-scheme: dark)" />
    <title>至知</title>
    <meta
      name="description"
      content="至知：记录技术实践、项目复盘和长期学习的个人博客。"
    />
    <meta property="og:site_name" content="至知" />
    <meta property="og:locale" content="zh_CN" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="alternate" type="application/atom+xml" title="至知" href="/feed.xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=Noto+Serif+SC:wght@500;700;900&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23f8f7f2'/%3E%3Cpath d='M18 18h28v6H28l18 20v2H18v-6h18L18 20z' fill='%232f342d'/%3E%3Ccircle cx='48' cy='18' r='5' fill='%23b7791f'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app">
      <!--
        首屏 Splash：在 JS bundle 加载完成前即刻呈现品牌过渡页。
        Vue mount 时会整体替换 #app 内容，与 InitialLoader 视觉无缝衔接。
        样式必须完全内联（此时外部 CSS 尚未加载），禁止引用 CSS 变量。
      -->
      <div class="boot-splash" aria-hidden="true">
        <div class="boot-splash__content">
          <div class="boot-splash__masthead">
            <span>VOL. 03 · DIGITAL EDITION</span>
            <span class="boot-splash__dot">·</span>
            <span>EST. 2026</span>
          </div>
          <h1 class="boot-splash__title">至知 <em>Journal</em></h1>
          <div class="boot-splash__bar"><div class="boot-splash__fill"></div></div>
          <div class="boot-splash__caption">
            <span class="boot-splash__spinner"></span>
            <span>正在排版装订内容……</span>
          </div>
        </div>
      </div>
    </div>
    <style>
      .boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #f6f1e8;
        color: #1c1710;
        overflow: hidden;
      }
      .boot-splash::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          radial-gradient(circle, rgba(42, 36, 28, 0.14) 0.5px, transparent 0.6px),
          linear-gradient(90deg, rgba(42, 36, 28, 0.015), transparent 50%, rgba(255, 255, 255, 0.025));
        background-size: 4px 4px, 100% 100%;
        opacity: 0.22;
        mix-blend-mode: multiply;
        pointer-events: none;
      }
      .boot-splash__content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 2rem;
        animation: boot-splash-in 0.55s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .boot-splash__masthead {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 0.58rem;
        font-weight: 600;
        letter-spacing: 0.22em;
        color: #8b2500;
        text-transform: uppercase;
        margin-bottom: 0.6rem;
      }
      .boot-splash__dot { opacity: 0.5; }
      .boot-splash__title {
        margin: 0 0 1.2rem;
        font-family: "Playfair Display", "Noto Serif SC", serif;
        font-size: clamp(2.4rem, 6vw, 3.8rem);
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.1;
      }
      .boot-splash__title em {
        font-style: italic;
        font-weight: 400;
        color: #5e5548;
      }
      .boot-splash__bar {
        position: relative;
        width: min(240px, 60vw);
        height: 2px;
        background: rgba(42, 36, 28, 0.12);
        margin-bottom: 1.2rem;
        overflow: hidden;
        border-radius: 1px;
      }
      .boot-splash__fill {
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, #8b2500, #b84a2a);
        transform-origin: left center;
        animation: boot-splash-fill 2.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      }
      .boot-splash__caption {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 0.62rem;
        letter-spacing: 0.12em;
        color: #8a7f6f;
      }
      .boot-splash__spinner {
        width: 10px;
        height: 10px;
        border: 1.5px solid rgba(139, 37, 0, 0.25);
        border-top-color: #8b2500;
        border-radius: 50%;
        animation: boot-splash-spin 0.8s linear infinite;
      }
      @keyframes boot-splash-in {
        from { opacity: 0; transform: translate3d(0, 16px, 0); }
        to { opacity: 1; transform: translate3d(0, 0, 0); }
      }
      @keyframes boot-splash-fill {
        0% { transform: scaleX(0); }
        100% { transform: scaleX(0.92); }
      }
      @keyframes boot-splash-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash__content,
        .boot-splash__fill,
        .boot-splash__spinner {
          animation: none;
        }
        .boot-splash__fill { transform: scaleX(0.92); }
      }
    </style>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

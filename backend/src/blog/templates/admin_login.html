<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>后台登录</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f8fb;
        --grid: rgba(148, 163, 184, 0.18);
        --card: rgba(255, 255, 255, 0.9);
        --line: rgba(219, 228, 240, 0.95);
        --text: #0f172a;
        --muted: #64748b;
        --accent: #1f3b67;
        --error-bg: #fef2f2;
        --error-line: #fecaca;
        --error-text: #991b1b;
        --shadow: 0 24px 60px rgba(15, 23, 42, 0.08);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
        font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--text);
        background:
          linear-gradient(var(--bg), var(--bg)),
          linear-gradient(to right, var(--grid) 1px, transparent 1px),
          linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
        background-size: auto, 60px 60px, 60px 60px;
      }

      .card {
        width: min(440px, 100%);
        padding: 30px;
        border-radius: 28px;
        border: 1px solid var(--line);
        background: var(--card);
        box-shadow: var(--shadow);
        backdrop-filter: blur(16px);
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        min-height: 30px;
        padding: 0 12px;
        border-radius: 999px;
        background: #ecf3ff;
        color: var(--accent);
        font-size: 0.84rem;
      }

      h1 {
        margin: 14px 0 10px;
        font-size: 2rem;
        letter-spacing: -0.03em;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.75;
      }

      .stack {
        display: grid;
        gap: 14px;
        margin-top: 22px;
      }

      label {
        display: grid;
        gap: 8px;
        color: #334155;
      }

      input {
        width: 100%;
        height: 50px;
        padding: 0 14px;
        border-radius: 16px;
        border: 1px solid #dbe4f0;
        background: #ffffff;
        color: inherit;
        outline: none;
      }

      input:focus {
        border-color: #90a8c6;
        box-shadow: 0 0 0 4px rgba(31, 59, 103, 0.08);
      }

      button {
        margin-top: 6px;
        width: 100%;
        height: 50px;
        border: 0;
        border-radius: 16px;
        background: var(--accent);
        color: #ffffff;
        cursor: pointer;
      }

      .message {
        margin-top: 18px;
        padding: 12px 14px;
        border-radius: 14px;
        border: 1px solid var(--error-line);
        background: var(--error-bg);
        color: var(--error-text);
        line-height: 1.6;
      }

      .helper {
        margin-top: 16px;
        font-size: 0.9rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <form class="card" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <span class="eyebrow">Admin Access</span>
      <h1>进入博客后台</h1>
      <p>登录后可以维护首页资料、关于页内容、Markdown 草稿和图片资源。</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="message">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <div class="stack">
        <label>
          后台密码
          <input type="password" name="password" placeholder="请输入后台密码" required />
        </label>
        <button type="submit">进入后台</button>
      </div>

      <p class="helper">建议部署前在 <code>.env</code> 中修改密码和后台路径。</p>
    </form>
  </body>
</html>

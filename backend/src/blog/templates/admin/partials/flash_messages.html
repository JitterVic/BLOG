{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="messages">
      {% for category, message in messages %}
        <div class="message message--{{ category or 'info' }} {% if category == 'error' %}error{% elif category == 'success' %}success{% endif %}" role="{{ 'alert' if category == 'error' else 'status' }}" aria-live="{{ 'assertive' if category == 'error' else 'polite' }}">
          <span>{{ message }}</span>
          <button type="button" class="message-close" aria-label="关闭提示" onclick="this.parentElement.remove()">&times;</button>
        </div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}

<aside class="author-drawer" id="publish-panel" hidden aria-labelledby="publish-panel-title">
  <div class="author-drawer__head"><div><span>Preflight</span><h2 id="publish-panel-title">发布检查</h2></div><button type="button" data-close-panel="publish-panel" aria-label="关闭发布检查">×</button></div>
  <div class="author-drawer__body">
    <div id="publish-check-summary" class="publish-check-summary">正在检查文章……</div>
    <div id="publish-check-errors" class="publish-check-list"></div>
    <div id="publish-check-warnings" class="publish-check-list"></div>
  </div>
  <div class="author-drawer__footer"><button type="button" data-close-panel="publish-panel">继续编辑</button><button type="button" id="publish-confirm-button" class="primary" hidden>确认发布</button></div>
</aside>

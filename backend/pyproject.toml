[project]
name = "blog-backend"
version = "1.0.0"
description = "Flask + Vue 个人博客的服务端（API + Jinja 管理后台 + SPA 托管）"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0,<4.0",
    "Markdown>=3.6,<4.0",
    "Pillow>=10.0,<13.0",
]

[dependency-groups]
dev = ["pytest>=8,<10"]
prod = ["gunicorn>=22.0,<24.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
